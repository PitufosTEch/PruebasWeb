/* ═══════════════════════════════════════════════════════
   PERSISTENCIA — localStorage + Firebase Realtime DB
═══════════════════════════════════════════════════════ */
let _fbSynced = false;
let _fbPending = false;
let _fbOnline  = true;

function loadData() {
  // 1) localStorage inmediato para render rápido
  try { db = JSON.parse(localStorage.getItem(LS_KEY) || 'null') || {}; } catch { db = {}; }
  // 2) SEED como base para fechas sin registro
  for (const [d, v] of Object.entries(SEED)) {
    if (!db[d]) db[d] = { ...v };
  }
  // 3) Monitorear conexión a Firebase
  _fbDB.ref('.info/connected').on('value', snap => {
    _fbOnline = !!snap.val();
    if (_fbOnline && _fbPending) _pushToFirebase();
    updateFooter();
  });
  // 4) Cargar desde Firebase (prioridad sobre localStorage)
  _fbDB.ref(FB_PATH).once('value').then(snap => {
    const fbData = snap.val();
    if (fbData && typeof fbData === 'object') {
      for (const [d, v] of Object.entries(fbData)) { db[d] = v; }
      localStorage.setItem(LS_KEY, JSON.stringify(db));
      _fbSynced = true;
      renderMonth();
    } else {
      // Firebase vacío → subir estado local
      _pushToFirebase();
    }
    updateFooter();
  }).catch(err => {
    console.warn('[Bitácora] Firebase load error:', err.message);
    updateFooter();
  });
}

function saveData() {
  // Guardar en localStorage inmediatamente
  localStorage.setItem(LS_KEY, JSON.stringify(db));
  _fbPending = true;
  updateFooter();
  // Guardar en Firebase inmediatamente (sin debounce)
  _pushToFirebase();
}

function _pushToFirebase() {
  _fbDB.ref(FB_PATH).set(db).then(() => {
    _fbPending = false;
    _fbSynced  = true;
    updateFooter();
  }).catch(err => {
    // Quedará pendiente; se reintenta cuando .info/connected vuelva a true
    console.warn('[Bitácora] Firebase write error (reintento al reconectar):', err.message);
    _fbPending = true;
    updateFooter();
  });
}

function updateFooter() {
  const n = Object.keys(db).length;
  const hora = new Date().toLocaleTimeString('es-CL');
  let sync;
  if (!_fbOnline)       sync = ' · 🔴 Sin red — guardado local, sincronizará al reconectar';
  else if (_fbPending)  sync = ' · ☁️ Sincronizando...';
  else if (_fbSynced)   sync = ' · ☁️ Backup en nube OK';
  else                  sync = ' · ⚠️ Sin confirmar';
  document.getElementById('footer-info').textContent =
    'Guardado · ' + n + ' registros · ' + hora + sync;
}

function getEntry(date) {
  if (!db[date]) db[date] = {};
  return db[date];
}

// Forzar push al cerrar la pestaña (seguro contra cierre accidental)
window.addEventListener('beforeunload', () => {
  if (_fbPending) {
    navigator.sendBeacon && _fbDB.ref(FB_PATH).set(db);
  }
});

/* ═══════════════════════════════════════════════════════
   APPSHEET — CARGA DE PROYECTOS Y BENEFICIARIOS
═══════════════════════════════════════════════════════ */
function normId(s) { const str = String(s || ''); return /^\d+$/.test(str) ? 'P' + str : str; }

function parsePrData(raw) {
  // Acepta tanto formato snapshot {rows:[...]} como array directo
  const proyRaw = raw?.Proyectos?.rows || raw?.Proyectos || [];
  const benRaw  = raw?.Beneficiario?.rows || raw?.Beneficiario || [];

  const lista = proyRaw
    .filter(p => {
      const est = String(p.estado_general || '').toLowerCase();
      return (est.includes('ejecuci') || est.includes('finaliz')) && !/prueba/i.test(p.NOMBRE_PROYECTO || '');
    })
    .map(p => ({ id: normId(p.ID_proy), nombre: String(p.NOMBRE_PROYECTO || '') }))
    .filter(p => p.id && p.nombre)
    .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));

  const benef = {};
  for (const b of benRaw) {
    const pid = normId(b.ID_Proy);
    if (!pid) continue;
    const nombre = ((b.NOMBRES || '') + ' ' + (b.APELLIDOS || '')).trim();
    if (!nombre || nombre.toLowerCase() === 'nan') continue;
    if (!benef[pid]) benef[pid] = [];
    if (!benef[pid].includes(nombre)) benef[pid].push(nombre);
  }
  for (const pid in benef) benef[pid].sort();

  return { proyectos: lista, beneficiarios: benef };
}

async function loadAppSheetData() {
  showLoading(true, 'Cargando obras...');

  // ── 1. Snapshot de GitHub (mismo CDN que usa el dashboard principal) ──
  try {
    const resp = await fetch(SNAPSHOT_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) throw new Error('Snapshot HTTP ' + resp.status);
    const raw = await resp.json();
    const { proyectos, beneficiarios } = parsePrData(raw);
    if (proyectos.length > 0) {
      PROYECTOS      = proyectos;
      BENEF_POR_PROY = beneficiarios;
      dataLoaded     = true;
      showLoading(false);
      renderMonth();
      return;   // snapshot OK: no hace falta AppSheet
    }
  } catch (e) {
    console.warn('[Bitácora] Snapshot error:', e);
  }

  // ── 2. AppSheet directo (fallback si el snapshot falla) ──
  try {
    const url = APPS_SCRIPT_URL + '?tables=' + encodeURIComponent('Proyectos,Beneficiario');
    const resp = await fetch(url, { redirect: 'follow' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const raw = await resp.json();
    const { proyectos, beneficiarios } = parsePrData(raw);
    if (proyectos.length > 0) {
      PROYECTOS      = proyectos;
      BENEF_POR_PROY = beneficiarios;
      dataLoaded     = true;
    }
  } catch (err) {
    console.warn('[Bitácora] AppSheet fetch falló:', err);
  }

  showLoading(false, dataLoaded ? '' : 'Sin conexión — modo texto libre');
  renderMonth();
}

function showLoading(on, msg) {
  const el = document.getElementById('load-badge');
  if (on) {
    el.classList.add('show');
    if (msg) document.getElementById('load-msg').textContent = msg;
  } else {
    el.classList.remove('show');
  }
}

/* ═══════════════════════════════════════════════════════
   HELPERS DE RENDERIZADO
═══════════════════════════════════════════════════════ */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtFecha(dateStr) {
  const p = dateStr.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function todayStr() { return new Date().toISOString().substring(0, 10); }

function buildEstadoSel(date, estado) {
  const opts = [
    ['',        '— Sin estado —', 'e-empty'],
    ['trabajo', '✅ Trabajo',      'e-trabajo'],
    ['licencia','🏥 Licencia',     'e-licencia'],
    ['feriado', '🏖️ Feriado',      'e-feriado'],
    ['descanso','💤 Descanso',     'e-descanso'],
    ['medico',  '🩺 Médico',       'e-medico'],
    ['taller',  '🔧 Taller',       'e-taller'],
  ];
  const clsMap = {trabajo:'e-trabajo',licencia:'e-licencia',feriado:'e-feriado',descanso:'e-descanso',medico:'e-medico',taller:'e-taller','':'e-empty'};
  const cls = clsMap[estado] || 'e-empty';
  let s = '<select class="sel-estado ' + cls + '" data-date="' + date + '" onchange="onEstado(this)">';
  for (const [v, lbl] of opts) {
    s += '<option value="' + v + '"' + (estado === v ? ' selected' : '') + '>' + lbl + '</option>';
  }
  return s + '</select>';
}

function buildProySel(date, proyId) {
  if (!dataLoaded) {
    return '<input class="field-inp" style="border-color:#fcd34d;background:#fffbeb" type="text" value="' + esc(proyId) + '" placeholder="Obra..." data-date="' + date + '" data-field="proyecto" oninput="onField(this)">';
  }
  const selName = (PROYECTOS.find(p => p.id === proyId) || {}).nombre || '';
  return '<div class="combo-wrap">' +
    '<input class="combo-inp obra-combo" type="text" value="' + esc(selName) + '" ' +
    'placeholder="— Sin obra —" autocomplete="off" ' +
    'data-date="' + date + '" ' +
    'oninput="comboFilter(this,\'obra\')" ' +
    'onfocus="comboOpen(this,\'obra\')" ' +
    'onblur="comboBlur(this,\'obra\')">' +
    '<div class="combo-drop" id="combodrop_obra_' + date + '"></div>' +
    '</div>';
}

function buildBenefField(date, proyId, benefNombre) {
  if (!dataLoaded) {
    return '<input class="field-inp" type="text" value="' + esc(benefNombre) + '" placeholder="Beneficiario..." data-date="' + date + '" data-field="beneficiario" oninput="onField(this)">';
  }
  return '<div class="combo-wrap">' +
    '<input class="combo-inp benef-combo" type="text" value="' + esc(benefNombre) + '" ' +
    'placeholder="— seleccionar —" autocomplete="off" ' +
    'data-date="' + date + '" data-proyid="' + esc(proyId) + '" ' +
    'oninput="comboFilter(this,\'benef\')" ' +
    'onfocus="comboOpen(this,\'benef\')" ' +
    'onblur="comboBlur(this,\'benef\')">' +
    '<div class="combo-drop" id="combodrop_benef_' + date + '"></div>' +
    '</div>';
}

const BADGES = {
  licencia: '<span class="badge badge-licencia">🏥 Licencia</span>',
  feriado:  '<span class="badge badge-feriado">🏖️ Feriado</span>',
  descanso: '<span class="badge badge-descanso">💤 Descanso</span>',
};

function buildRow(date) {
  const d      = new Date(date + 'T12:00:00');
  const wd     = d.getDay();
  const num    = d.getDate();
  const entry  = db[date] || {};
  const estado = entry.estado || '';
  const proyId = entry.proyecto || '';
  const benef  = entry.beneficiario || '';
  const desc   = entry.descripcion  || '';
  const obs    = entry.obs          || '';

  const isTrabajo = estado === 'trabajo';
  const isMedico  = estado === 'medico';
  const isTaller  = estado === 'taller';
  const weekend   = wd === 0 || wd === 6;
  const isToday   = date === todayStr();
  const rowCls    = (weekend ? 'weekend ' : '') + (isToday ? 'today' : '');

  let html = '<tr class="' + rowCls + '" id="row_' + date + '">';
  html += '<td class="td-num">' + num + '</td>';
  html += '<td class="td-dia">' + DIAS[wd] + '</td>';
  html += '<td class="td-fecha">' + fmtFecha(date) + '</td>';
  html += '<td class="td-estado">' + buildEstadoSel(date, estado) + '</td>';

  if (isTrabajo) {
    html += '<td class="td-proy">'   + buildProySel(date, proyId)             + '</td>';
    html += '<td class="td-benef">'  + buildBenefField(date, proyId, benef)   + '</td>';
    html += '<td class="td-desc"><input class="field-inp" type="text" value="' + esc(desc) + '" placeholder="Descripción..." list="desc-list" data-date="' + date + '" data-field="descripcion" oninput="onField(this)"></td>';
    html += '<td class="td-obs"><input class="field-inp" type="text" value="' + esc(obs) + '" placeholder="Observaciones..." data-date="' + date + '" data-field="obs" oninput="onField(this)"></td>';
  } else if (isMedico) {
    html += '<td class="td-proy inactive"></td>';
    html += '<td class="td-benef"><input class="field-inp" type="text" value="' + esc(benef) + '" placeholder="Detalle / Motivo..." data-date="' + date + '" data-field="beneficiario" oninput="onField(this)"></td>';
    html += '<td class="td-desc inactive"></td>';
    html += '<td class="td-obs inactive"></td>';
  } else if (isTaller) {
    html += '<td class="td-proy inactive"></td>';
    html += '<td class="td-benef"><input class="field-inp" type="text" value="' + esc(benef) + '" placeholder="Servicio técnico / Detalle..." data-date="' + date + '" data-field="beneficiario" oninput="onField(this)"></td>';
    html += '<td class="td-desc"><input class="field-inp" type="text" value="' + esc(desc) + '" placeholder="Trabajo realizado..." data-date="' + date + '" data-field="descripcion" oninput="onField(this)"></td>';
    html += '<td class="td-obs"><input class="field-inp" type="text" value="' + esc(obs) + '" placeholder="Observaciones taller..." data-date="' + date + '" data-field="obs" oninput="onField(this)"></td>';
  } else {
    const badge = BADGES[estado] || '';
    html += '<td class="td-proy inactive"></td>';
    html += '<td class="td-benef inactive">' + badge + '</td>';
    html += '<td class="td-desc inactive"></td>';
    html += '<td class="td-obs inactive"></td>';
  }

  html += '</tr>';
  return html;
}

/* ═══════════════════════════════════════════════════════
   RENDERIZADO DEL MES
═══════════════════════════════════════════════════════ */
function renderMonth() {
  const label = MESES[curMonth] + ' ' + curYear;
  document.getElementById('month-label').textContent = label;

  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
  let html = '';
  for (let d = 1; d <= daysInMonth; d++) {
    const mm      = String(curMonth + 1).padStart(2, '0');
    const dd      = String(d).padStart(2, '0');
    html += buildRow(curYear + '-' + mm + '-' + dd);
  }
  document.getElementById('bitacora-body').innerHTML = html;
  updateSummary();
}

function updateSummary() {
  const mm = String(curMonth + 1).padStart(2, '0');
  const prefix = curYear + '-' + mm + '-';
  const cnts = { trabajo:0, licencia:0, feriado:0, medico:0, descanso:0, taller:0, '':0 };
  const days  = new Date(curYear, curMonth + 1, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const ds = prefix + String(d).padStart(2, '0');
    const e  = (db[ds] || {}).estado || '';
    if (cnts[e] !== undefined) cnts[e]++; else cnts['']++;
  }
  document.getElementById('cnt-trabajo').textContent  = cnts.trabajo;
  document.getElementById('cnt-licencia').textContent = cnts.licencia;
  document.getElementById('cnt-feriado').textContent  = cnts.feriado;
  document.getElementById('cnt-medico').textContent   = cnts.medico;
  document.getElementById('cnt-descanso').textContent = cnts.descanso + cnts[''];
  document.getElementById('cnt-taller').textContent   = cnts.taller;
}

/* ═══════════════════════════════════════════════════════
   COMBOBOX — OBRA Y BENEFICIARIO
═══════════════════════════════════════════════════════ */
function comboOpts(type, date, proyId) {
  if (type === 'obra') return PROYECTOS.map(p => ({ val: p.id, label: p.nombre }));
  const pid = proyId || (db[date] || {}).proyecto || '';
  return (BENEF_POR_PROY[pid] || []).map(n => ({ val: n, label: n }));
}

function comboPopulate(drop, opts, query, type) {
  const q = query.toLowerCase().trim();
  const filtered = q ? opts.filter(o => o.label.toLowerCase().includes(q)) : opts;
  if (!filtered.length) {
    drop.innerHTML = '<div class="combo-opt no-result">Sin resultados</div>';
  } else {
    drop.innerHTML = filtered.map(o =>
      '<div class="combo-opt" data-val="' + esc(o.val) + '"' +
      ' onmousedown="event.preventDefault();comboSelect(this,\'' + type + '\')">' +
      esc(o.label) + '</div>'
    ).join('');
  }
}

function comboOpen(inp, type) {
  if (!dataLoaded) return;
  const date = inp.dataset.date;
  const drop = document.getElementById('combodrop_' + type + '_' + date);
  if (!drop) return;
  comboPopulate(drop, comboOpts(type, date, inp.dataset.proyid), '', type);
  drop.classList.add('open');
}

function comboFilter(inp, type) {
  if (!dataLoaded) return;
  const date = inp.dataset.date;
  const drop = document.getElementById('combodrop_' + type + '_' + date);
  if (drop) {
    comboPopulate(drop, comboOpts(type, date, inp.dataset.proyid), inp.value, type);
    drop.classList.add('open');
  }
  if (type === 'benef') { getEntry(date).beneficiario = inp.value; saveData(); }
}

function comboSelect(opt, type) {
  const val  = opt.dataset.val;
  const inp  = opt.closest('.combo-wrap').querySelector('.combo-inp');
  const drop = opt.closest('.combo-drop');
  const date = inp.dataset.date;
  drop.classList.remove('open');
  if (type === 'obra') {
    const entry = getEntry(date);
    entry.proyecto     = val;
    entry.beneficiario = '';
    saveData();
    const tr = document.getElementById('row_' + date);
    if (tr) tr.outerHTML = buildRow(date);
  } else {
    getEntry(date).beneficiario = val;
    inp.value = val;
    saveData();
  }
}

function comboBlur(inp, type) {
  setTimeout(function() {
    const date = inp.dataset.date;
    const drop = document.getElementById('combodrop_' + type + '_' + date);
    if (drop) drop.classList.remove('open');
    if (type === 'benef') { getEntry(date).beneficiario = inp.value; saveData(); }
  }, 200);
}

/* ═══════════════════════════════════════════════════════
   HANDLERS
═══════════════════════════════════════════════════════ */
function onEstado(sel) {
  const date  = sel.dataset.date;
  const nuevo = sel.value;
  const entry = getEntry(date);
  entry.estado = nuevo;
  if (nuevo !== 'trabajo') entry.proyecto = '';
  if (nuevo !== 'trabajo' && nuevo !== 'medico' && nuevo !== 'taller') {
    entry.beneficiario = '';
    entry.descripcion  = '';
    entry.obs          = '';
  }
  saveData();
  const tr = document.getElementById('row_' + date);
  if (tr) tr.outerHTML = buildRow(date);
  updateSummary();
}

function onProyChange(sel) {
  const date  = sel.dataset.date;
  const entry = getEntry(date);
  entry.proyecto    = sel.value;
  entry.beneficiario = '';  // reset al cambiar proyecto
  saveData();
  const tr = document.getElementById('row_' + date);
  if (tr) tr.outerHTML = buildRow(date);
}

function onBenefSel(sel) {
  const date  = sel.dataset.date;
  const entry = getEntry(date);
  const inp   = sel.nextElementSibling;
  if (sel.value === '__otro__') {
    if (inp) inp.classList.add('show');
    entry.beneficiario = (inp && inp.value) || '';
  } else {
    if (inp) inp.classList.remove('show');
    entry.beneficiario = sel.value;
  }
  saveData();
}

function onField(inp) {
  const entry = getEntry(inp.dataset.date);
  entry[inp.dataset.field] = inp.value;
  saveData();
}

/* ═══════════════════════════════════════════════════════
   NAVEGACIÓN DE MES
═══════════════════════════════════════════════════════ */
document.getElementById('prev-month').addEventListener('click', () => {
  curMonth--;
  if (curMonth < 0) { curMonth = 11; curYear--; }
  renderMonth();
});
document.getElementById('next-month').addEventListener('click', () => {
  curMonth++;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  renderMonth();
});

/* ═══════════════════════════════════════════════════════
   OPERADOR
═══════════════════════════════════════════════════════ */
const opInp = document.getElementById('op-input');
opInp.value = localStorage.getItem(LS_OP) || '';
opInp.addEventListener('input', () => localStorage.setItem(LS_OP, opInp.value));

/* ═══════════════════════════════════════════════════════
   EXPORTAR EXCEL
═══════════════════════════════════════════════════════ */
function exportarExcel() {
  const operador   = opInp.value || 'Sin especificar';
  const allDates   = Object.keys(db).sort();
  if (!allDates.length) { alert('No hay datos para exportar.'); return; }

  const ESTADO_LABELS = {trabajo:'Trabajo',licencia:'Licencia',feriado:'Feriado',descanso:'Descanso',medico:'Médico/Examen',taller:'Taller','':'—'};
  const proyNombre = (id) => {
    if (!id) return '';
    const p = PROYECTOS.find(x => x.id === id);
    return p ? p.id + ' — ' + p.nombre : id;
  };

  const cell = v => '<td>' + String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</td>';
  let rows = '';
  for (const date of allDates) {
    const d     = new Date(date + 'T12:00:00');
    const entry = db[date] || {};
    const est   = entry.estado || '';
    rows += '<tr>' +
      cell(DIAS[d.getDay()]) +
      cell(fmtFecha(date)) +
      cell(ESTADO_LABELS[est] || est) +
      cell(proyNombre(entry.proyecto)) +
      cell(entry.beneficiario || '') +
      cell(entry.descripcion  || '') +
      cell(entry.obs          || '') +
      '</tr>';
  }

  const xls = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="UTF-8"></head><body><table>' +
    '<tr><td colspan="7"><b>BITÁCORA MINIEXCAVADORA — CONSTRUCTORA LAS RAÍCES</b></td></tr>' +
    '<tr><td>Operador: ' + operador + '</td><td colspan="6">Exportado: ' + new Date().toLocaleString('es-CL') + '</td></tr>' +
    '<tr></tr>' +
    '<tr style="background:#78350f;color:#fff;font-weight:bold">' +
    '<td>Día</td><td>Fecha</td><td>Estado</td><td>Obra</td><td>Beneficiario</td><td>Descripción</td><td>Observaciones</td>' +
    '</tr>' + rows + '</table></body></html>';

  const blob = new Blob(['﻿' + xls], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Bitacora_Miniexcavadora_' + new Date().toISOString().substring(0,10) + '.xls';
  a.click();
}
