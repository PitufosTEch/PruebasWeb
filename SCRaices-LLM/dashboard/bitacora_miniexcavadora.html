*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#fafaf9;color:#1c1917;font-size:13px}

/* ── HEADER ── */

.header-center{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:15px;font-weight:700;line-height:1.4;transition:.15s}
.month-nav button:hover{background:rgba(255,255,255,.35)}
#month-label{font-size:15px;font-weight:700;min-width:130px;text-align:center}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.op-wrap{display:flex;align-items:center;gap:5px;font-size:10px;opacity:.9}
.op-wrap label{white-space:nowrap}
.op-wrap input{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:5px;padding:3px 7px;font-size:10px;width:130px}
.op-wrap input::placeholder{color:rgba(255,255,255,.5)}
.load-badge{font-size:10px;background:rgba(255,255,255,.2);border-radius:5px;padding:3px 7px;display:none;align-items:center;gap:4px}
.load-badge.show{display:flex}
.spinner{width:11px;height:11px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.export-btn{background:#fff;color:#92400e;border:none;border-radius:7px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.export-btn:hover{background:#fef3c7}

/* ── SUMMARY BAR ── */
.summary-bar{background:#fffbeb;border-bottom:1px solid #fde68a;padding:7px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.stat .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot-trabajo{background:#16a34a}.dot-licencia{background:#ea580c}
.dot-feriado{background:#dc2626}.dot-medico{background:#2563eb}.dot-descanso{background:#9ca3af}
.stat span.num{font-size:13px;font-weight:800;color:#1c1917}

/* ── TABLE ── */

table{width:100%;border-collapse:collapse;min-width:1020px}
thead th{background:#78350f;color:#fff;padding:8px 8px;font-size:11px;font-weight:600;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:5}
thead th:first-child{width:36px;text-align:center}
tbody tr{border-bottom:1px solid #e7e5e4;transition:background .1s}
tbody tr:hover{background:#fef9c3 !important}
tbody tr.weekend{background:#f5f5f4}
tbody tr.today td.td-num{background:#fbbf24;color:#78350f;font-weight:800;border-radius:3px}
td{padding:4px 6px;vertical-align:middle}
.td-num{text-align:center;font-weight:700;color:#78350f;font-size:12px;width:34px}
.td-dia{font-size:11px;color:#57534e;white-space:nowrap;width:74px;font-weight:500}
.td-fecha{font-size:11px;color:#57534e;white-space:nowrap;width:80px}
.td-estado{width:128px}
.td-proy{width:210px}
.td-benef{width:175px}
.td-desc{width:210px}
.td-obs{min-width:165px}
td.inactive{background:#f5f5f4 !important}

/* ═══════════════════════════════════════════════════════
   APPSHEET — CARGA DE PROYECTOS Y BENEFICIARIOS
═══════════════════════════════════════════════════════ */
function normId(s) { const str = String(s || ''); return /^\d+$/.test(str) ? 'P' + str : str; }

async function loadAppSheetData() {
  showLoading(true, 'Cargando proyectos...');
  try {
    const url = APPS_SCRIPT_URL + '?tables=' + encodeURIComponent('Proyectos,Beneficiario');
    const resp = await fetch(url, { redirect: 'follow' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

    // ── Proyectos ──
    const proyRaw = data['Proyectos'] || [];
    PROYECTOS = proyRaw
      .filter(p => {
        const est = (p.estado_general || '').toLowerCase();
        return est.includes('ejecuci') || est.includes('finalizado');
      })
      .map(p => ({ id: normId(p.ID_proy), nombre: String(p.NOMBRE_PROYECTO || '') }))
      .filter(p => p.id && p.nombre && !/prueba/i.test(p.nombre))
      .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));

    // ── Beneficiarios por proyecto ──
    const benRaw = data['Beneficiario'] || [];
    BENEF_POR_PROY = {};
    for (const b of benRaw) {
      const pid = normId(b.ID_Proy);
      if (!pid) continue;
      const nombre = ((b.NOMBRES || '') + ' ' + (b.APELLIDOS || '')).trim();
      if (!nombre || nombre.toLowerCase() === 'nan') continue;
      if (!BENEF_POR_PROY[pid]) BENEF_POR_PROY[pid] = [];
      if (!BENEF_POR_PROY[pid].includes(nombre)) BENEF_POR_PROY[pid].push(nombre);
    }
    // Ordenar nombres por apellido dentro de cada proyecto
    for (const pid in BENEF_POR_PROY) BENEF_POR_PROY[pid].sort();

    dataLoaded = true;
    showLoading(false);
    renderMonth(); // volver a renderizar con dropdowns correctos
  } catch (err) {
    console.warn('[Bitácora] AppSheet fetch falló:', err);
    showLoading(false, 'Sin conexión — modo texto libre');
    renderMonth();
  }
}

function showLoading(on, msg) {
  const el = document.getElementById('load-badge');
  if (on) {
    el.classList.add('show');
    if (msg) document.getElementById('load-msg').textContent = msg;
  } else {
    el.classList.remove('show');
  }
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtFecha(dateStr) {
  const p = dateStr.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function todayStr() { return new Date().toISOString().substring(0, 10); }

function buildEstadoSel(date, estado) {
  const opts = [
    ['',        '— Sin estado —', 'e-empty'],
    ['trabajo', '✅ Trabajo',      'e-trabajo'],
    ['licencia','🏥 Licencia',     'e-licencia'],
    ['feriado', '🏖️ Feriado',      'e-feriado'],
    ['descanso','💤 Descanso',     'e-descanso'],
    ['medico',  '🩺 Médico',       'e-medico'],
  ];
  const clsMap = {trabajo:'e-trabajo',licencia:'e-licencia',feriado:'e-feriado',descanso:'e-descanso',medico:'e-medico','':'e-empty'};
  const cls = clsMap[estado] || 'e-empty';
  let s = '<select class="sel-estado ' + cls + '" data-date="' + date + '" onchange="onEstado(this)">';
  for (const [v, lbl] of opts) {
    s += '<option value="' + v + '"' + (estado === v ? ' selected' : '') + '>' + lbl + '</option>';
  }
  return s + '</select>';
}

function buildProySel(date, proyId) {
  if (!dataLoaded || PROYECTOS.length === 0) {
    // fallback: free text
    return '<input class="field-inp" style="border-color:#fcd34d;background:#fffbeb" type="text" value="' + esc(proyId) + '" placeholder="Proyecto..." data-date="' + date + '" data-field="proyecto" oninput="onField(this)">';
  }
  let s = '<select class="proy-sel" data-date="' + date + '" onchange="onProyChange(this)">';
  s += '<option value="">— Sin proyecto —</option>';
  for (const p of PROYECTOS) {
    const lbl = p.id + ' — ' + p.nombre;
    s += '<option value="' + esc(p.id) + '"' + (proyId === p.id ? ' selected' : '') + '>' + esc(lbl) + '</option>';
  }
  s += '</select>';
  return s;
}

function buildBenefField(date, proyId, benefNombre) {
  const opts = proyId ? (BENEF_POR_PROY[proyId] || []) : [];

  if (!dataLoaded || opts.length === 0) {
    // No hay datos o no hay proyecto: campo libre
    return '<input class="field-inp" type="text" value="' + esc(benefNombre) + '" placeholder="Beneficiario..." data-date="' + date + '" data-field="beneficiario" oninput="onField(this)">';
  }

  // Hay opciones: select + opción "Otro..."
  const isCustom = benefNombre && !opts.includes(benefNombre);
  let s = '<select class="benef-sel" data-date="' + date + '" onchange="onBenefSel(this)">';
  s += '<option value="">— seleccionar —</option>';
  for (const o of opts) {
    s += '<option value="' + esc(o) + '"' + (benefNombre === o && !isCustom ? ' selected' : '') + '>' + esc(o) + '</option>';
  }
  s += '<option value="__otro__"' + (isCustom ? ' selected' : '') + '>Otro / Libre...</option>';
  s += '</select>';
  s += '<input class="benef-inp' + (isCustom ? ' show' : '') + '" type="text" value="' + (isCustom ? esc(benefNombre) : '') + '" placeholder="Nombre libre..." data-date="' + date + '" data-field="beneficiario" oninput="onField(this)">';
  return s;
}

const BADGES = {
  licencia: '<span class="badge badge-licencia">🏥 Licencia</span>',
  feriado:  '<span class="badge badge-feriado">🏖️ Feriado</span>',
  descanso: '<span class="badge badge-descanso">💤 Descanso</span>',
};

function buildRow(date) {
  const d      = new Date(date + 'T12:00:00');
  const wd     = d.getDay();
  const num    = d.getDate();
  const entry  = db[date] || {};
  const estado = entry.estado || '';
  const proyId = entry.proyecto || '';
  const benef  = entry.beneficiario || '';
  const desc   = entry.descripcion  || '';
  const obs    = entry.obs          || '';

  const isTrabajo = estado === 'trabajo';
  const isMedico  = estado === 'medico';
  const weekend   = wd === 0 || wd === 6;
  const isToday   = date === todayStr();
  const rowCls    = (weekend ? 'weekend ' : '') + (isToday ? 'today' : '');

  let html = '<tr class="' + rowCls + '" id="row_' + date + '">';
  html += '<td class="td-num">' + num + '</td>';
  html += '<td class="td-dia">' + DIAS[wd] + '</td>';
  html += '<td class="td-fecha">' + fmtFecha(date) + '</td>';
  html += '<td class="td-estado">' + buildEstadoSel(date, estado) + '</td>';

  if (isTrabajo) {
    html += '<td class="td-proy">'   + buildProySel(date, proyId)             + '</td>';
    html += '<td class="td-benef">'  + buildBenefField(date, proyId, benef)   + '</td>';
    html += '<td class="td-desc"><input class="field-inp" type="text" value="' + esc(desc) + '" placeholder="Descripción..." list="desc-list" data-date="' + date + '" data-field="descripcion" oninput="onField(this)"></td>';
    html += '<td class="td-obs"><input class="field-inp" type="text" value="' + esc(obs) + '" placeholder="Obra / Observaciones..." list="obra-list" data-date="' + date + '" data-field="obs" oninput="onField(this)"></td>';
  } else if (isMedico) {
    html += '<td class="td-proy inactive"></td>';
    html += '<td class="td-benef"><input class="field-inp" type="text" value="' + esc(benef) + '" placeholder="Detalle / Motivo..." data-date="' + date + '" data-field="beneficiario" oninput="onField(this)"></td>';
    html += '<td class="td-desc inactive"></td>';
    html += '<td class="td-obs inactive"></td>';
  } else {
    const badge = BADGES[estado] || '';
    html += '<td class="td-proy inactive"></td>';
    html += '<td class="td-benef inactive">' + badge + '</td>';
    html += '<td class="td-desc inactive"></td>';
    html += '<td class="td-obs inactive"></td>';
  }

  html += '</tr>';
  return html;
}

/* ═══════════════════════════════════════════════════════
   RENDERIZADO DEL MES
═══════════════════════════════════════════════════════ */
function renderMonth() {
  const label = MESES[curMonth] + ' ' + curYear;
  document.getElementById('month-label').textContent = label;

  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
  let html = '';
  for (let d = 1; d <= daysInMonth; d++) {
    const mm      = String(curMonth + 1).padStart(2, '0');
    const dd      = String(d).padStart(2, '0');
    html += buildRow(curYear + '-' + mm + '-' + dd);
  }
  document.getElementById('bitacora-body').innerHTML = html;
  updateSummary();
}

function updateSummary() {
  const mm = String(curMonth + 1).padStart(2, '0');
  const prefix = curYear + '-' + mm + '-';
  const cnts = { trabajo:0, licencia:0, feriado:0, medico:0, descanso:0, '':0 };
  const days  = new Date(curYear, curMonth + 1, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const ds = prefix + String(d).padStart(2, '0');
    const e  = (db[ds] || {}).estado || '';
    if (cnts[e] !== undefined) cnts[e]++; else cnts['']++;
  }
  document.getElementById('cnt-trabajo').textContent  = cnts.trabajo;
  document.getElementById('cnt-licencia').textContent = cnts.licencia;
  document.getElementById('cnt-feriado').textContent  = cnts.feriado;
  document.getElementById('cnt-medico').textContent   = cnts.medico;
  document.getElementById('cnt-descanso').textContent = cnts.descanso + cnts[''];
}

/* ═══════════════════════════════════════════════════════
   HANDLERS
═══════════════════════════════════════════════════════ */
function onEstado(sel) {
  const date  = sel.dataset.date;
  const nuevo = sel.value;
  const entry = getEntry(date);
  entry.estado = nuevo;
  if (nuevo !== 'trabajo') { entry.proyecto = ''; entry.descripcion = ''; entry.obs = ''; }
  if (nuevo !== 'trabajo' && nuevo !== 'medico') entry.beneficiario = '';
  saveData();
  const tr = document.getElementById('row_' + date);
  if (tr) tr.outerHTML = buildRow(date);
  updateSummary();
}

function onProyChange(sel) {
  const date  = sel.dataset.date;
  const entry = getEntry(date);
  entry.proyecto    = sel.value;
  entry.beneficiario = '';  // reset al cambiar proyecto
  saveData();
  const tr = document.getElementById('row_' + date);
  if (tr) tr.outerHTML = buildRow(date);
}

function onBenefSel(sel) {
  const date  = sel.dataset.date;
  const entry = getEntry(date);
  const inp   = sel.nextElementSibling;
  if (sel.value === '__otro__') {
    if (inp) inp.classList.add('show');
    entry.beneficiario = (inp && inp.value) || '';
  } else {
    if (inp) inp.classList.remove('show');
    entry.beneficiario = sel.value;
  }
  saveData();
}

function onField(inp) {
  const entry = getEntry(inp.dataset.date);
  entry[inp.dataset.field] = inp.value;
  saveData();
}

/* ═══════════════════════════════════════════════════════
   NAVEGACIÓN DE MES
═══════════════════════════════════════════════════════ */
document.getElementById('prev-month').addEventListener('click', () => {
  curMonth--;
  if (curMonth < 0) { curMonth = 11; curYear--; }
  renderMonth();
});
document.getElementById('next-month').addEventListener('click', () => {
  curMonth++;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  renderMonth();
});

/* ═══════════════════════════════════════════════════════
   OPERADOR
═══════════════════════════════════════════════════════ */
const opInp = document.getElementById('op-input');
opInp.value = localStorage.getItem(LS_OP) || '';
opInp.addEventListener('input', () => localStorage.setItem(LS_OP, opInp.value));

/* ═══════════════════════════════════════════════════════
   EXPORTAR EXCEL
═══════════════════════════════════════════════════════ */
function exportarExcel() {
  const operador   = opInp.value || 'Sin especificar';
  const allDates   = Object.keys(db).sort();
  if (!allDates.length) { alert('No hay datos para exportar.'); return; }

  const ESTADO_LABELS = {trabajo:'Trabajo',licencia:'Licencia',feriado:'Feriado',descanso:'Descanso',medico:'Médico/Examen','':'—'};
  const proyNombre = (id) => {
    if (!id) return '';
    const p = PROYECTOS.find(x => x.id === id);
    return p ? p.id + ' — ' + p.nombre : id;
  };

  const cell = v => '<td>' + String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</td>';
  let rows = '';
  for (const date of allDates) {
    const d     = new Date(date + 'T12:00:00');
    const entry = db[date] || {};
    const est   = entry.estado || '';
    rows += '<tr>' +
      cell(DIAS[d.getDay()]) +
      cell(fmtFecha(date)) +
      cell(ESTADO_LABELS[est] || est) +
      cell(proyNombre(entry.proyecto)) +
      cell(entry.beneficiario || '') +
      cell(entry.descripcion  || '') +
      cell(entry.obs          || '') +
      '</tr>';
  }

  const xls = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="UTF-8"></head><body><table>' +
    '<tr><td colspan="7"><b>BITÁCORA MINIEXCAVADORA — CONSTRUCTORA LAS RAÍCES</b></td></tr>' +
    '<tr><td>Operador: ' + operador + '</td><td colspan="6">Exportado: ' + new Date().toLocaleString('es-CL') + '</td></tr>' +
    '<tr></tr>' +
    '<tr style="background:#78350f;color:#fff;font-weight:bold">' +
    '<td>Día</td><td>Fecha</td><td>Estado</td><td>Proyecto</td><td>Beneficiario</td><td>Descripción</td><td>Observaciones / Obra</td>' +
    '</tr>' + rows + '</table></body></html>';

  const blob = new Blob(['﻿' + xls], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Bitacora_Miniexcavadora_' + new Date().toISOString().substring(0,10) + '.xls';
  a.click();
}

/* ═══════════════════════════════════════════════════════
   INICIO

loadData();

curYear  = hoy.getFullYear();
curMonth = hoy.getMonth();
if (curYear < 2026 || (curYear === 2026 && curMonth < 5)) {
  curYear = 2026; curMonth = 6;
}

// Renderizado inicial (sin proyectos AppSheet aún)

updateFooter();

loadAppSheetData();
