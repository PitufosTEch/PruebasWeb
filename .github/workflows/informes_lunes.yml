name: Informes Semanales — Lunes

# Genera los informes usando Playwright (mismo motor que el dashboard)
# y los envía por Gmail SMTP a los destinatarios en Firebase personal_global.
#
# Horario: lunes 13:00 UTC = 10:00 AM Chile.
# curvas_semanal corre a 11:00 UTC y tarda hasta 60 min → datos frescos a las 13:00.

on:
  schedule:
    - cron: '0 14 * * 1'   # Lunes 14:00 UTC = 10:00 AM Chile (CLT invierno UTC-4)
                            # En verano CLST (UTC-3) llega a las 11 AM — aceptable
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo prueba (no envía correos)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      test_email:
        description: 'Enviar SOLO a este correo (vacío = todos los destinatarios)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: informes-lunes
  cancel-in-progress: false

jobs:
  enviar-informes:
    name: Generar y enviar informes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: informes-pip-${{ runner.os }}-${{ hashFiles('SCRaices-LLM/informes/requirements.txt') }}
          restore-keys: informes-pip-${{ runner.os }}-

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install requests playwright

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
          restore-keys: playwright-chromium-

      - name: Instalar Playwright Chromium
        run: playwright install chromium

      - name: Generar y enviar informes
        working-directory: SCRaices-LLM/informes
        env:
          FIREBASE_URL:        ${{ secrets.FIREBASE_URL }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          # Cron automático siempre envía (DRY_RUN=false).
          # workflow_dispatch: usa el input elegido (default true = no envía).
          DRY_RUN:    ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run || 'true' }}
          TEST_EMAIL: ${{ inputs.test_email || '' }}
        run: python enviar_informes_lunes.py

      - name: Resumen en caso de error
        if: failure()
        run: echo "::error::Envío de informes falló. Revisa el log completo."
