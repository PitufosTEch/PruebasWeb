name: Actualización Curvas S

# Un runner por proyecto, todos en paralelo.
# Post-proceso sincroniza dashboard y Firebase al finalizar todos.
#
# Horario: 11:00 UTC = 08:00 Chile verano (UTC-3) / 07:00 Chile invierno (UTC-4)

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: curvas-semanal
  cancel-in-progress: false

jobs:
  # ── Job 1: Un runner por proyecto (paralelo) ─────────────────────────────
  curvas-proyecto:
    name: "Curvas — ${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "P119 Ñuke Mapu",        id: P119,  delay: 0   }
          - { label: "P38  Aliwen",            id: P38,   delay: 15  }
          - { label: "P39  El Coihue",         id: P39,   delay: 30  }
          - { label: "P127 Nuevo Cunco",       id: P127,  delay: 45  }
          - { label: "P12  Juan Huilcan",      id: P12,   delay: 60  }
          - { label: "P14  Com. Madihue",      id: P14,   delay: 75  }
          - { label: "P126 El Maitén",         id: P126,  delay: 90  }
          - { label: "P131 Raíces Melipeuco",  id: P131,  delay: 105 }
          - { label: "P116 Sonia Quilaleo",    id: P116,  delay: 120 }
          - { label: "P31  Trovolhue",         id: P31,   delay: 135 }
          - { label: "P28  Elsa Pinchulaf",    id: P28,   delay: 150 }
          # ── Proyectos futuros — agregar aquí cuando tengan Gantt ──────────
          # - { label: "P118 El Canelo",        id: P118,  delay: 165 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: curvas-pip-${{ runner.os }}-${{ hashFiles('SCRaices-LLM/curvas_s/requirements.txt') }}
          restore-keys: curvas-pip-

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install \
            matplotlib scipy Pillow numpy requests \
            google-auth google-auth-httplib2 google-api-python-client \
            playwright

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
          restore-keys: playwright-chromium-

      - name: Instalar Playwright Chromium
        run: playwright install chromium --with-deps

      - name: "Esperar ${{ matrix.delay }}s (escalonamiento AppSheet)"
        run: sleep ${{ matrix.delay }}

      - name: "Ejecutar Curvas S — ${{ matrix.label }}"
        working-directory: SCRaices-LLM/curvas_s
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_URL:         https://scraices-dashboard-default-rtdb.firebaseio.com
          APPSHEET_COOKIES_B64: ${{ secrets.APPSHEET_COOKIES_B64 }}
        run: |
          for intento in 1 2 3; do
            python curvas_master.py ${{ matrix.id }} && break
            if [ "$intento" -eq 3 ]; then
              echo "::error::3 intentos fallaron para ${{ matrix.label }}"
              exit 1
            fi
            echo "Intento $intento fallido — reintentando en 60s..."
            sleep 60
          done

      - name: Resumen en caso de error
        if: failure()
        run: echo "::error::Curvas S fallaron para ${{ matrix.label }}"

  # ── Job 2: Post-proceso — dashboard y Firebase ────────────────────────────
  post-proceso:
    name: Sincronizar Dashboard y Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: curvas-proyecto
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: curvas-pip-${{ runner.os }}-${{ hashFiles('SCRaices-LLM/curvas_s/requirements.txt') }}
          restore-keys: curvas-pip-

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install \
            matplotlib scipy Pillow numpy requests \
            google-auth google-auth-httplib2 google-api-python-client

      - name: Sincronizar dashboard (CURVAS_S_CONFIG → GitHub Pages)
        working-directory: SCRaices-LLM/curvas_s
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_URL:         https://scraices-dashboard-default-rtdb.firebaseio.com
        run: |
          for intento in 1 2 3; do
            python curvas_master.py --sync-dashboard && break
            if [ "$intento" -eq 3 ]; then exit 1; fi
            echo "Intento $intento fallido — reintentando en 30s..."
            sleep 30
          done

      - name: Actualizar programa Gantt en Firebase
        working-directory: SCRaices-LLM/curvas_s
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FIREBASE_URL:         https://scraices-dashboard-default-rtdb.firebaseio.com
        run: python actualizar_gantt_programa.py

      - name: Calcular avance Gantt en Firebase
        working-directory: SCRaices-LLM/curvas_s
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FIREBASE_URL:         https://scraices-dashboard-default-rtdb.firebaseio.com
        run: python calcular_avance_gantt.py

      - name: Resumen en caso de error
        if: failure()
        run: echo "::error::Post-proceso falló"

  # ── Job 3: Sincronizar despachos AppSheet → Firebase ─────────────────────
  sincronizar-despachos:
    name: Sincronizar Despachos AppSheet → Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: curvas-proyecto
    if: always()
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: despachos-pip-${{ runner.os }}
          restore-keys: despachos-pip-

      - name: Instalar dependencias
        run: pip install --upgrade pip requests playwright

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
          restore-keys: playwright-chromium-

      - name: Instalar Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Sincronizar despachos futuros → Firebase
        working-directory: SCRaices-LLM/curvas_s
        env:
          APPSHEET_COOKIES_B64: ${{ secrets.APPSHEET_COOKIES_B64 }}
          FIREBASE_URL:         https://scraices-dashboard-default-rtdb.firebaseio.com
        run: python sincronizar_soldespachos.py --ventana 0

      - name: Resumen en caso de error
        if: failure()
        run: echo "::error::Sincronización de despachos falló"
